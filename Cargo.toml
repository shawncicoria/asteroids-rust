[package]
name = "asteroids-rust"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "asteroids"
path = "src/main.rs"

[dependencies]
ratatui   = "0.29"
crossterm = "0.28"
rand      = { version = "0.8", features = ["std_rng"] }
serde     = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
